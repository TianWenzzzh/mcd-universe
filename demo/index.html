<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("starmap-data").textContent);
  if (new URLSearchParams(location.search).get("nebula") === "1") {
    DATA = { status: "nebula", stars: [], summary: { orderCount: 0, totalAmount: 0 } };
  }
  var CATS = {
    "汉堡": "#FF5B5B", "早餐": "#FFB347", "甜品": "#FF6FA8",
    "小食": "#FFD166", "饮品": "#59B2FF"
  };
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var stars = DATA.stars || [];
  var isNebula = !stars.length;
  var particles = [], raf = 0, startT = 0, selected = -1;
  var CX = 0, CY = 0;
  var ROT_SPEED = 0.000012;
  var PHASE_TEXT = 2300, PHASE_HOLD = 600, FADE_START = 1400, FADE_DUR = 1800;

  // ---------- 布局：时间序 → 星系旋臂 ----------
  function layoutStars() {
    var n = stars.length;
    var narrow = W < 640;
    var minD = Math.min(W, H) * (narrow ? 1.34 : 1);  // 竖屏放大一档，避免星群缩在中间
    CX = W / 2; CY = H * (narrow ? 0.56 : 0.52);
    var times = stars.map(function (s) {
      if (!s.time) return 0;
      var d = new Date(String(s.time).replace(" ", "T") + "+08:00");
      return isNaN(d.getTime()) ? 0 : d.getTime();
    });
    var tMin = Math.min.apply(null, times), tMax = Math.max.apply(null, times);
    stars.forEach(function (s, i) {
      var t = tMax > tMin ? (times[i] - tMin) / (tMax - tMin) : (n > 1 ? i / (n - 1) : 0.5);
      var ang = -Math.PI * 0.75 + t * Math.PI * 2.05;
      var rad = minD * 0.085 + Math.pow(t, 0.9) * minD * 0.315 + (s.magnitude - 1) * 4;
      s.bx = CX + Math.cos(ang) * rad;
      s.by = CY + Math.sin(ang) * rad * 0.6;
      s.ang = ang;
      s.r = 3.0 + s.magnitude * 1.5;
      s.phase = Math.random() * Math.PI * 2;
      s.tw = 0.55 + Math.random() * 0.9;
      s.x = s.bx; s.y = s.by;
    });
  }

  function rotateStars(el) {
    var a = REDUCED ? 0 : el * ROT_SPEED, ca = Math.cos(a), sa = Math.sin(a);
    stars.forEach(function (s) {
      var dx = s.bx - CX, dy = s.by - CY;
      s.x = CX + dx * ca - dy * sa;
      s.y = CY + dx * sa + dy * ca;
    });
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- 深空背景（离屏缓存）----------
  var bgCache = null;
  function buildBackdropCache() {
    bgCache = document.createElement("canvas");
    bgCache.width = W * DPR; bgCache.height = H * DPR;
    var bc = bgCache.getContext("2d");
    bc.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = bc.createRadialGradient(W * .5, H * .44, 0, W * .5, H * .44, Math.max(W, H) * .78);
    g.addColorStop(0, "#100c26"); g.addColorStop(.5, "#080614"); g.addColorStop(1, "#03020a");
    bc.fillStyle = g; bc.fillRect(0, 0, W, H);

    bc.globalCompositeOperation = "lighter";
    var clouds = [
      [.22, .26, .40, "#4a2f8f", .17], [.80, .22, .34, "#0f5570", .14],
      [.66, .78, .42, "#7a2358", .13], [.14, .82, .30, "#8a5a14", .10],
      [.50, .50, .62, "#1a2f7a", .09]
    ];
    clouds.forEach(function (c) {
      var cg = bc.createRadialGradient(W * c[0], H * c[1], 0, W * c[0], H * c[1], Math.min(W, H) * c[2]);
      cg.addColorStop(0, hexA(c[3], c[4]));
      cg.addColorStop(.55, hexA(c[3], c[4] * .35));
      cg.addColorStop(1, hexA(c[3], 0));
      bc.fillStyle = cg;
      bc.fillRect(0, 0, W, H);
    });
    bc.save();
    bc.translate(W * .5, H * .46); bc.rotate(-0.42);
    var ag = bc.createLinearGradient(0, -H * .16, 0, H * .16);
    ag.addColorStop(0, "rgba(90,200,190,0)");
    ag.addColorStop(.5, "rgba(90,205,190,.055)");
    ag.addColorStop(1, "rgba(90,200,190,0)");
    bc.fillStyle = ag;
    bc.fillRect(-W, -H * .16, W * 2, H * .32);
    bc.restore();

    var tints = ["#ffffff", "#ffffff", "#cfe0ff", "#ffe9c9", "#ffd1e8"];
    for (var i = 0; i < 460; i++) {
      var layer = i % 3;
      var sx = Math.random() * W, sy = Math.random() * H;
      var size = layer === 0 ? .35 + Math.random() * .35 : layer === 1 ? .5 + Math.random() * .55 : .7 + Math.random() * .9;
      var alpha = layer === 0 ? .18 + Math.random() * .2 : layer === 1 ? .3 + Math.random() * .3 : .45 + Math.random() * .4;
      bc.fillStyle = hexA(tints[Math.floor(Math.random() * tints.length)], alpha);
      bc.beginPath(); bc.arc(sx, sy, size, 0, Math.PI * 2); bc.fill();
    }
    bc.globalCompositeOperation = "source-over";

    var vg = bc.createRadialGradient(W * .5, H * .5, Math.min(W, H) * .30, W * .5, H * .5, Math.max(W, H) * .75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.62)");
    bc.fillStyle = vg; bc.fillRect(0, 0, W, H);
  }

  function drawBackdrop(el, still) {
    if (!bgCache) buildBackdropCache();
    ctx.drawImage(bgCache, 0, 0, W, H);
    if (!still) drawShootingStars(el);
  }

  // ---------- 星系核心 ----------
  function drawGalacticCore(el) {
    if (isNebula) return;
    var pulse = REDUCED ? 1 : 0.9 + 0.1 * Math.sin(el / 2400);
    ctx.globalCompositeOperation = "lighter";
    var R = Math.min(W, H) * 0.40;
    var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    g.addColorStop(0, "rgba(255,222,150," + (0.11 * pulse) + ")");
    g.addColorStop(.45, "rgba(255,190,120," + (0.045 * pulse) + ")");
    g.addColorStop(1, "rgba(255,180,110,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- 星点（精灵缓存 + 加色叠加 + 星芒）----------
  var sprites = {};
  function starSprite(color, r) {
    var key = color + "|" + (Math.round(r * 2) / 2);
    if (sprites[key]) return sprites[key];
    var size = Math.max(24, Math.ceil(r * 18));
    var c = document.createElement("canvas"); c.width = c.height = size;
    var sc = c.getContext("2d");
    var ctr = size / 2;
    var g = sc.createRadialGradient(ctr, ctr, 0, ctr, ctr, ctr);
    g.addColorStop(0, hexA(color, .95));
    g.addColorStop(.10, hexA(color, .6));
    g.addColorStop(.30, hexA(color, .22));
    g.addColorStop(.62, hexA(color, .06));
    g.addColorStop(1, hexA(color, 0));
    sc.fillStyle = g; sc.fillRect(0, 0, size, size);
    sprites[key] = c; return c;
  }

  function drawStar(s, el) {
    var tw = 0.78 + 0.22 * Math.sin(el / (520 * s.tw) + s.phase);
    var r = s.r * tw;
    ctx.globalCompositeOperation = "lighter";
    var sp = starSprite(s.color, s.r);
    var R = s.r * 10 * tw;
    ctx.globalAlpha = .9;
    ctx.drawImage(sp, s.x - R, s.y - R, R * 2, R * 2);
    if (s.magnitude >= 4) {
      var flare = r * (3.2 + 0.6 * Math.sin(el / 340 + s.phase));
      ctx.globalAlpha = .5 * tw;
      var fg = ctx.createLinearGradient(s.x - flare, s.y, s.x + flare, s.y);
      fg.addColorStop(0, hexA(s.color, 0)); fg.addColorStop(.5, hexA(s.color, .55)); fg.addColorStop(1, hexA(s.color, 0));
      ctx.strokeStyle = fg; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(s.x - flare, s.y); ctx.lineTo(s.x + flare, s.y); ctx.stroke();
      var fg2 = ctx.createLinearGradient(s.x, s.y - flare, s.x, s.y + flare);
      fg2.addColorStop(0, hexA(s.color, 0)); fg2.addColorStop(.5, hexA(s.color, .55)); fg2.addColorStop(1, hexA(s.color, 0));
      ctx.strokeStyle = fg2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y - flare); ctx.lineTo(s.x, s.y + flare); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.1, r * 0.42), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(s.color, .85);
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.8, r * 0.8), 0, Math.PI * 2); ctx.fill();
    if (selected === stars.indexOf(s)) {
      ctx.strokeStyle = "rgba(255,227,150,.9)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, r + 9 + 2 * Math.sin(el / 220), 0, Math.PI * 2); ctx.stroke();
    }
  }

  // ---------- 星座连线 ----------
  function drawConstellation() {
    if (stars.length < 2) return;
    ctx.globalCompositeOperation = "lighter";
    for (var i = 1; i < stars.length; i++) {
      var a = stars[i - 1], b = stars[i];
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.hypot(dx, dy) || 1;
      var k = 0.16;
      var cxp = mx - (dy / len) * len * k, cyp = my + (dx / len) * len * k;
      var lg = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      lg.addColorStop(0, "rgba(255,226,160,.28)");
      lg.addColorStop(.5, "rgba(255,226,160,.13)");
      lg.addColorStop(1, "rgba(255,226,160,.28)");
      ctx.strokeStyle = lg; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(cxp, cyp, b.x, b.y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- 流星 ----------
  var meteors = [], nextMeteor = 900;
  function drawShootingStars(el) {
    if (REDUCED) return;
    if (el > nextMeteor && meteors.length < 2) {
      nextMeteor = el + 1600 + Math.random() * 2400;
      var fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? -30 : W + 30, y: Math.random() * H * 0.35,
        vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 5), vy: 1.8 + Math.random() * 2.2, life: 0
      });
    }
    ctx.globalCompositeOperation = "lighter";
    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life += 16;
      var tail = 60;
      var mg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * tail / 6, m.y - m.vy * tail / 6);
      mg.addColorStop(0, "rgba(255,255,255,.95)");
      mg.addColorStop(.4, "rgba(200,220,255,.35)");
      mg.addColorStop(1, "rgba(200,220,255,0)");
      ctx.strokeStyle = mg; ctx.lineWidth = 1.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * tail / 6, m.y - m.vy * tail / 6); ctx.stroke();
      if (m.life > 850 || m.x < -70 || m.x > W + 70) meteors.splice(i, 1);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- 粒子入场 ----------
  function rasterText() {
    var off = document.createElement("canvas");
    off.width = W; off.height = H;
    var octx = off.getContext("2d");
    var size = Math.min(W / 5.2, 92);
    octx.fillStyle = "#fff";
    octx.font = "700 " + size + "px -apple-system, PingFang SC, Microsoft YaHei, sans-serif";
    octx.textAlign = "center"; octx.textBaseline = "middle";
    octx.fillText("麦门宇宙", W / 2, H / 2);
    var img = octx.getImageData(0, 0, W, H).data;
    var pts = [];
    var step = Math.max(3, Math.floor(W / 220));
    for (var y = 0; y < H; y += step) {
      for (var x = 0; x < W; x += step) {
        if (img[(y * W + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
      }
    }
    return pts;
  }

  function buildParticles() {
    var pts = isNebula ? [] : rasterText();
    var n = isNebula ? 300 : Math.max(pts.length, 900);
    particles = [];
    for (var i = 0; i < n; i++) {
      var star = isNebula ? null : stars[i % stars.length];
      particles.push({
        x: Math.random() * W, y: Math.random() * H, px: 0, py: 0,
        tx: pts.length ? pts[i % pts.length].x : W / 2 + (Math.random() - 0.5) * W * 0.62,
        ty: pts.length ? pts[i % pts.length].y : H / 2 + (Math.random() - 0.5) * H * 0.62,
        star: star, size: star ? star.r * 0.62 : 0.7 + Math.random() * 1.5,
        color: star ? hexA(star.color, 0.95) : "rgba(220,225,255," + (0.25 + Math.random() * 0.55) + ")",
        speed: 0.011 + Math.random() * 0.02, delay: Math.random() * 480
      });
    }
  }

  // ---------- 场景 ----------
  function drawScene(el, opts) {
    var still = !!(opts && opts.still);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    drawBackdrop(el, still);

    if (isNebula) { drawNebula(el); return; }

    rotateStars(el);
    drawGalacticCore(el);

    if (REDUCED) {
      drawConstellation();
      stars.forEach(function (s) { drawStar(s, 0); });
      document.getElementById("persona").classList.add("show");
      return;
    }

    var toStars = el > PHASE_TEXT + PHASE_HOLD;
    var fade = 1;
    if (toStars) {
      var fadeEl = el - (PHASE_TEXT + PHASE_HOLD + FADE_START);
      fade = fadeEl <= 0 ? 1 : Math.max(0, 1 - fadeEl / FADE_DUR);
    }

    if (!still && fade > 0.01) {
      ctx.globalCompositeOperation = "lighter";
      particles.forEach(function (p) {
        if (el < p.delay) { dot(p.x, p.y, p.size, p.color); return; }
        p.px = p.x; p.py = p.y;
        var target = toStars && p.star ? { x: p.star.x, y: p.star.y } : { x: p.tx, y: p.ty };
        p.x += (target.x - p.x) * p.speed * (toStars ? 1.7 : 1);
        p.y += (target.y - p.y) * p.speed * (toStars ? 1.7 : 1);
        var dx = p.x - p.px, dy = p.y - p.py;
        if (dx * dx + dy * dy > 1.2) {
          ctx.strokeStyle = p.color; ctx.globalAlpha = 0.35 * fade; ctx.lineWidth = p.size * 0.9;
          ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
        }
        ctx.globalAlpha = fade;
        dot(p.x, p.y, p.size, p.color);
        ctx.globalAlpha = 1;
      });
      ctx.globalCompositeOperation = "source-over";
    }

    if (toStars) {
      drawConstellation();
      stars.forEach(function (s) { drawStar(s, el); });
      if (!document.getElementById("persona").classList.contains("show")) {
        document.getElementById("persona").classList.add("show");
      }
    } else if (el > PHASE_TEXT * 0.9) {
      particles.forEach(function (p) { if (Math.random() < 0.02) p.size = 0.6 + Math.random() * 2; });
    }
  }

  function frame(t) {
    if (!startT) startT = t;
    drawScene(t - startT);
    raf = requestAnimationFrame(frame);
  }

  // ---------- 星云态 ----------
  function drawNebula(el) {
    ctx.globalCompositeOperation = "lighter";
    var R = Math.min(W, H) * 0.34;
    var g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
    g.addColorStop(0, "rgba(255,222,150,.10)");
    g.addColorStop(1, "rgba(255,200,120,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, H / 2, R, 0, Math.PI * 2); ctx.fill();

    var drift = REDUCED ? 0 : 1;
    particles.forEach(function (p) {
      p.x += Math.sin(el / 2200 + p.delay) * 0.32 * drift;
      p.y += Math.cos(el / 2800 + p.delay) * 0.32 * drift;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      dot(p.x, p.y, p.size, p.color);
    });
    ctx.globalCompositeOperation = "source-over";

    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(255,217,122,.6)"; ctx.shadowBlur = 26;
    ctx.fillStyle = "#ffe9a8";
    ctx.font = "700 26px -apple-system, PingFang SC, Microsoft YaHei, sans-serif";
    ctx.fillText("宇宙初开", W / 2, H / 2 - 12);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(214,208,236,.62)";
    ctx.font = "13px -apple-system, PingFang SC, sans-serif";
    ctx.fillText("你的第一颗星还没点亮 —— 去麦麦吧，未来可期", W / 2, H / 2 + 24);
    ctx.textAlign = "start";
  }

  // ---------- HUD ----------
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function renderHUD() {
    var sum = DATA.summary || {};
    var html = "<b>" + (sum.orderCount || 0) + "</b> 颗星<br>累计 ¥" + (sum.totalAmount || 0).toFixed(1);
    var acc = DATA.account;
    if (acc && (Number(acc.availablePoint) > 0 || Number(acc.nextMouthExpirePoint) > 0)) {
      html += "<br>积分 " + (acc.availablePoint || 0);
      if (Number(acc.nextMouthExpirePoint) > 0) html += " · 下月过期 " + acc.nextMouthExpirePoint;
    }
    document.getElementById("stats").innerHTML = html;
    var daily = document.getElementById("daily");
    if (DATA.daily && DATA.daily.title) {
      daily.innerHTML = '<span class="tag">今日麦签</span><br>' + esc(DATA.daily.title);
      daily.style.display = "block";
    }
    var legend = document.getElementById("legend");
    legend.innerHTML = "";
    Object.keys(CATS).forEach(function (c) {
      var span = document.createElement("span");
      span.innerHTML = '<i style="background:' + CATS[c] + ';color:' + CATS[c] + '"></i>' + c;
      legend.appendChild(span);
    });
    if (DATA.persona) {
      document.getElementById("persona-name").textContent = "麦门人格 · " + DATA.persona.name;
      document.getElementById("persona-desc").textContent = DATA.persona.desc;
    }
  }

  // ---------- 交互 ----------
  var detail = document.getElementById("detail");
  canvas.addEventListener("click", function (e) {
    if (isNebula) return;
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var best = -1, bd = 28;
    stars.forEach(function (s, i) {
      var d = Math.hypot(s.x - mx, s.y - my);
      if (d < bd) { bd = d; best = i; }
    });
    selected = best;
    if (best < 0) { detail.classList.remove("show"); return; }
    var s = stars[best];
    detail.innerHTML =
      '<div class="row"><span class="k">餐品</span><span class="v">' + esc(s.product || "—") + "</span></div>" +
      '<div class="row"><span class="k">门店</span><span class="v">' + esc(s.store || "—") + "</span></div>" +
      '<div class="row"><span class="k">时间</span><span class="v">' + esc(s.time || "—") + "</span></div>" +
      '<div class="row"><span class="k">实付</span><span class="v">¥' + (s.amount || 0).toFixed(1) + "</span></div>" +
      '<div class="row"><span class="k">品类 / 星等</span><span class="v">' + s.category + " · " + s.magnitude + " 等</span></div>";
    detail.classList.add("show");
  });

  // ---------- 分享卡 ----------
  function composeCard() {
    drawScene(1e9, { still: true });
    var ec = document.createElement("canvas");
    ec.width = 1080; ec.height = 1440;
    var ex = ec.getContext("2d");
    var g = ex.createRadialGradient(540, 600, 0, 540, 600, 980);
    g.addColorStop(0, "#100c26"); g.addColorStop(.55, "#080614"); g.addColorStop(1, "#03020a");
    ex.fillStyle = g; ex.fillRect(0, 0, 1080, 1440);
    try {
      var scale = Math.max(1080 / canvas.width, 1440 / canvas.height);
      var dw = canvas.width * scale, dh = canvas.height * scale;
      ex.drawImage(canvas, (1080 - dw) / 2, (1440 - dh) / 2, dw, dh);
    } catch (err) {}
    var band = ex.createLinearGradient(0, 980, 0, 1440);
    band.addColorStop(0, "rgba(4,3,11,0)");
    band.addColorStop(.45, "rgba(4,3,11,.82)");
    band.addColorStop(1, "rgba(4,3,11,.96)");
    ex.fillStyle = band; ex.fillRect(0, 980, 1080, 460);
    var top = ex.createLinearGradient(0, 0, 0, 240);
    top.addColorStop(0, "rgba(4,3,11,.88)"); top.addColorStop(1, "rgba(4,3,11,0)");
    ex.fillStyle = top; ex.fillRect(0, 0, 1080, 240);

    ex.textAlign = "center";
    ex.shadowColor = "rgba(255,217,122,.55)"; ex.shadowBlur = 34;
    ex.fillStyle = "#ffe9a8";
    ex.font = "700 66px -apple-system, PingFang SC, Microsoft YaHei, sans-serif";
    ex.fillText("麦门宇宙", 540, 128);
    ex.shadowBlur = 0;
    ex.fillStyle = "rgba(214,208,236,.72)"; ex.font = "26px -apple-system, PingFang SC, sans-serif";
    ex.fillText("MCUNIVERSE · 我的每一单，都是星海里的一颗星", 540, 178);

    var lg = ex.createLinearGradient(240, 0, 840, 0);
    lg.addColorStop(0, "rgba(255,217,122,0)");
    lg.addColorStop(.5, "rgba(255,217,122,.5)");
    lg.addColorStop(1, "rgba(255,217,122,0)");
    ex.strokeStyle = lg; ex.lineWidth = 1;
    ex.beginPath(); ex.moveTo(240, 1268); ex.lineTo(840, 1268); ex.stroke();

    if (DATA.persona) {
      ex.shadowColor = "rgba(255,217,122,.5)"; ex.shadowBlur = 22;
      ex.fillStyle = "#ffe9a8";
      ex.font = "700 46px -apple-system, PingFang SC, Microsoft YaHei, sans-serif";
      ex.fillText("麦门人格 · " + DATA.persona.name, 540, 1330);
      ex.shadowBlur = 0;
      ex.fillStyle = "rgba(214,208,236,.8)"; ex.font = "25px -apple-system, PingFang SC, sans-serif";
      wrapText(ex, DATA.persona.desc, 540, 1378, 860, 38);
    }
    ex.fillStyle = "rgba(163,157,194,.62)"; ex.font = "21px -apple-system, PingFang SC, sans-serif";
    ex.fillText((DATA.summary.orderCount || 0) + " 颗星 · 累计 ¥" + (DATA.summary.totalAmount || 0).toFixed(1)
      + " · 数据本地处理", 540, 1416);
    return ec;
  }
  function wrapText(c, text, x, y, maxW, lh) {
    var line = "", yy = y;
    for (var i = 0; i < text.length; i++) {
      line += text[i];
      if (c.measureText(line).width > maxW) { c.fillText(line, x, yy); line = ""; yy += lh; }
    }
    if (line) c.fillText(line, x, yy);
  }

  document.getElementById("btn-save").addEventListener("click", function () {
    var ec = composeCard();
    var a = document.createElement("a");
    a.download = "麦门宇宙-分享卡.png";
    a.href = ec.toDataURL("image/png");
    a.click();
  });

  // ---------- 图鉴 ----------
  var dexPanel = document.getElementById("dex-panel");
  var dexBtn = document.getElementById("btn-dex");
  function renderDex() {
    var list = document.getElementById("dex-list");
    list.innerHTML = "";
    (DATA.personas || []).forEach(function (p) {
      var div = document.createElement("div");
      div.className = "dex-item" + (p.mine ? " mine" : "");
      div.innerHTML = '<div class="n">' + esc(p.name) + '</div><div class="d">' + esc(p.desc) + "</div>";
      list.appendChild(div);
    });
  }
  dexBtn.addEventListener("click", function () {
    renderDex();
    dexPanel.classList.toggle("show");
    detail.classList.remove("show");
  });
  canvas.addEventListener("click", function (e) {
    if (dexPanel.classList.contains("show") && e.target === canvas) dexPanel.classList.remove("show");
  });

  document.getElementById("btn-replay").addEventListener("click", function () {
    cancelAnimationFrame(raf); startT = 0; selected = -1;
    detail.classList.remove("show");
    dexPanel.classList.remove("show");
    document.getElementById("persona").classList.remove("show");
    buildParticles(); raf = requestAnimationFrame(frame);
  });

  // ---------- 启动 ----------
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgCache = null;
    if (isNebula) return;
    layoutStars();
    if (startT && performance.now() - startT > PHASE_TEXT + PHASE_HOLD) {
      particles.forEach(function (p) { if (p.star) { p.x = p.star.x; p.y = p.star.y; } });
    }
  }
  window.addEventListener("resize", resize);

  resize();
  if (!isNebula) layoutStars();
  buildParticles();
  renderHUD();
  if (DATA.demo) {
    var badge = document.getElementById("demo-badge");
    if (badge) badge.style.display = "block";
  }
  window.__mcuniverse = {
    stars: stars, data: DATA, isNebula: isNebula, reduced: REDUCED,
    composeCard: composeCard,
    phase: function () { return performance.now() - startT; }
  };
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
